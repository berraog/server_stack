# Overlay: Raspberry Pi (arm64).
# Selected in ~/stack/.env with
#   COMPOSE_FILE=compose.yaml:hw/pi.yaml
#
# No Quick Sync overlay exists for the Pi because there is no hardware Plex can
# use: expect direct play only, and keep client-side transcoding off the box.
services:
  gluetun:
    environment:
      # The Pi has no AES-NI, so the cheaper cipher is the difference between
      # saturating the line and not. Dropped on x86, where it costs nothing.
      - OPENVPN_CIPHERS=AES-128-GCM
