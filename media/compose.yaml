# Media stack: VPN plus everything that must sit behind it.
#
# Two rules govern this file; the rest is detail.
#
# 1. qbittorrent and prowlarr use `network_mode: "service:gluetun"`, so they
#    have no network identity of their own — reach them at http://gluetun:<port>
#    and never give them a `ports:` block. README §5.
# 2. Everything that touches media mounts /mnt/active at the SAME container
#    path, /data — qBittorrent here, Radarr/Sonarr/Bazarr in arr.yaml, Plex
#    read-only below. One mount means completion is a rename and an *arr import
#    is a hardlink; one shared spelling means the path qBittorrent reports is
#    the path Radarr can open. README §1 and §13.
#
# Hardware-specific bits live in ../hw/, selected by COMPOSE_FILE in
# ~/stack/.env — only Quick Sync now, since WireGuard has a single cipher suite
# and removed the last reason for a Pi-specific override. ./arr.yaml holds the
# automation layer.
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=wireguard
      # NordLynx authenticates with a key, not the service credentials — see
      # README §2 for how to extract it. Nothing else replaces it.
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:?set in ~/stack/.env}
      # Carried over from the OpenVPN setup, where 1320 fixed fragmentation on
      # this ISP. gluetun's WireGuard default is 1400; too low costs a little
      # throughput, too high stalls transfers, so this errs low deliberately.
      # Raise it if you want the last few percent.
      - WIREGUARD_MTU=1320
      - SERVER_COUNTRIES=Sweden
      - TZ=${TZ:-Europe/Stockholm}
      - UPDATER_PERIOD=24h
    volumes:
      - /srv/appdata/media/gluetun:/gluetun
    # EVERY port for every container in gluetun's namespace is published here.
    #
    # These make the services reachable from the LAN. Publishing 6881 does NOT
    # make you connectable to peers on the internet: qBittorrent announces the
    # VPN exit node's address, so inbound traffic never reaches this host. Real
    # seeding needs a provider that forwards a port, which NordVPN does not do
    # — README §8, "Why nothing uploads".
    ports:
      - "8080:8080"      # qBittorrent WebUI
      - "6881:6881"      # torrent TCP
      - "6881:6881/udp"  # torrent UDP
      - "9696:9696"      # Prowlarr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun: {condition: service_healthy}
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Stockholm}
      - WEBUI_PORT=8080
    volumes:
      - /srv/appdata/media/qbittorrent:/config
      # One mount, the whole active disk — see rule 2 above. Inside it:
      # incomplete/, downloads/{movies,tv}/, library/{movies,tv}/, books/,
      # other/. Radarr and Sonarr set their own categories and save paths here;
      # books/ and other/ are yours, for manual Prowlarr grabs (README §8).
      - /mnt/active:/data
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun: {condition: service_healthy}
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Stockholm}
    volumes:
      - /srv/appdata/media/prowlarr:/config
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host          # needed for DLNA/GDM local discovery
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - VERSION=docker
      - TZ=${TZ:-Europe/Stockholm}
      # First run only; remove once the server is claimed. Token expires in 4
      # minutes — https://plex.tv/claim
      # - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - /srv/appdata/media/plex/config:/config
      # Transcode scratch: heavy short-lived writes, so it belongs on the
      # fastest disk. Swap for the tmpfs below if RAM allows — a full tmpfs
      # fails playback rather than spilling to disk, so size it for every
      # concurrent transcode.
      - /srv/appdata/media/plex/transcode:/transcode
      # The same /data spelling as everything else, read-only: Plex writes
      # metadata to /config, never to the library. Libraries point at
      # /data/library/movies and /data/library/tv (README §8).
      - /mnt/active:/data:ro
      - /mnt/archive:/archive:ro
    # tmpfs:
    #   - /transcode:size=4g
    restart: unless-stopped
