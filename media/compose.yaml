# Media stack: VPN plus everything that must sit behind it.
#
# Two rules govern this file; the rest is detail.
#
# 1. qbittorrent and prowlarr use `network_mode: "service:gluetun"`, so they
#    have no network identity of their own — reach them at http://gluetun:<port>
#    and never give them a `ports:` block. README §5.
# 2. qBittorrent sees exactly one mount, /data, which is the whole active disk.
#    Incomplete and finished folders are therefore always on one filesystem, so
#    completion is a rename rather than a copy — structurally, not by
#    remembering to keep two paths in sync. README §1.
#
# Hardware-specific bits (Quick Sync, VPN cipher) live in ../hw/, selected by
# COMPOSE_FILE in ~/stack/.env.
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=openvpn
      - OPENVPN_PROTOCOL=udp
      # Carried over from the Pi, where it fixed fragmentation on this ISP.
      # Raise or drop it if throughput disappoints; revert if torrents stall.
      - VPN_MTU=1320
      # Nord *service* credentials, not the login email/password.
      - OPENVPN_USER=${NORDVPN_SERVICE_USER:?set in ~/stack/.env}
      - OPENVPN_PASSWORD=${NORDVPN_SERVICE_PASS:?set in ~/stack/.env}
      - SERVER_COUNTRIES=Sweden
      - TZ=${TZ:-Europe/Stockholm}
      - UPDATER_PERIOD=24h
    volumes:
      - /srv/appdata/gluetun:/gluetun
    # EVERY port for every container in gluetun's namespace is published here.
    ports:
      - "8080:8080"      # qBittorrent WebUI
      - "6881:6881"      # torrent TCP
      - "6881:6881/udp"  # torrent UDP
      - "9696:9696"      # Prowlarr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun: {condition: service_healthy}
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Stockholm}
      - WEBUI_PORT=8080
    volumes:
      - /srv/appdata/qbittorrent:/config
      # One mount, the whole active disk — see rule 2 above. Inside it:
      # incomplete/, movies/, tv/, other/.
      - /mnt/active:/data
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun: {condition: service_healthy}
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Stockholm}
    volumes:
      - /srv/appdata/prowlarr:/config
    restart: unless-stopped

  finder:
    build: ../../git/torrent_finder
    container_name: torrent-finder
    depends_on: [prowlarr]
    # No media mount on purpose: the finder only ever talks to qBittorrent's and
    # Prowlarr's APIs. These paths are what it tells qBittorrent to use, so they
    # are qBittorrent's container paths, not the finder's.
    environment:
      - TZ=${TZ:-Europe/Stockholm}
      # gluetun, not prowlarr/qbittorrent — see README §5.
      - PROWLARR_URL=http://gluetun:9696
      - PROWLARR_API_KEY=${PROWLARR_API_KEY:?set in ~/stack/.env}
      - QBITTORRENT_URL=http://gluetun:8080
      - QBITTORRENT_USERNAME=${QBITTORRENT_USERNAME:-admin}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD:?set in ~/stack/.env}
      # One category per directory. `other` is the residual — software, games,
      # xxx, anything the classifier could not place — not "everything that is
      # not video".
      - MOVIES_SAVE_PATH=/data/movies
      - TV_SAVE_PATH=/data/tv
      - MUSIC_SAVE_PATH=/data/music
      - BOOKS_SAVE_PATH=/data/books
      - OTHER_SAVE_PATH=/data/other
      - MAX_TORRENT_SIZE_GB=${MAX_TORRENT_SIZE_GB:-25}
      - MIN_FREE_SPACE_GB=${MIN_FREE_SPACE_GB:-20}
      - INDEXER_NAME=TorrentDay
      # This app is published on the internet; refuse to start without auth.
      - UI_USERNAME=${UI_USERNAME:?set in ~/stack/.env}
      - UI_PASSWORD=${UI_PASSWORD:?set in ~/stack/.env}
    ports:
      - "8010:8000"    # LAN only; the tunnel uses the container port directly
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host          # needed for DLNA/GDM local discovery
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - VERSION=docker
      - TZ=${TZ:-Europe/Stockholm}
      # First run only; remove once the server is claimed. Token expires in 4
      # minutes — https://plex.tv/claim
      # - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - /srv/appdata/plex/config:/config
      # Transcode scratch: heavy short-lived writes, so it belongs on the
      # fastest disk. Swap for the tmpfs below if RAM allows — a full tmpfs
      # fails playback rather than spilling to disk, so size it for every
      # concurrent transcode.
      - /srv/appdata/plex/transcode:/transcode
      # Read-only: Plex writes metadata to /config, never to the library. This
      # also means Plex's own "delete media" is inert — deleting is the finder's
      # job, through qBittorrent, which has /data read-write.
      - /mnt/active:/active:ro
      - /mnt/archive:/archive:ro
    # tmpfs:
    #   - /transcode:size=4g
    restart: unless-stopped
