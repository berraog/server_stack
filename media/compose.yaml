# Media stack: VPN plus everything that must sit behind it.
#
# qbittorrent and prowlarr use `network_mode: "service:gluetun"`, so they have
# no network identity of their own — see README §5 before changing anything
# here. In short: reach them at http://gluetun:<port>, never by their own name,
# and they may never carry a `ports:` block.
#
# Storage split (README §1): container state on the internal SSD under
# /srv/appdata, bulk media on the USB drives. Downloads in progress stay on
# /mnt/usb2 with the finished folders on purpose — same filesystem means
# completion is a rename, and the finder's free-space guard measures that disk.
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=openvpn
      - OPENVPN_PROTOCOL=udp
      # No cipher pin: AES-128-GCM was a concession to the Pi's CPU. This box
      # has AES-NI, so gluetun's default (AES-256-GCM) costs nothing. For real
      # throughput the next step is VPN_TYPE=wireguard — see README §2.
      #
      # Carried over from the Pi, where it fixed fragmentation on this ISP.
      # Raise or drop it if throughput disappoints; revert if torrents stall.
      - VPN_MTU=1320
      # Nord *service* credentials, not the login email/password.
      - OPENVPN_USER=${NORDVPN_SERVICE_USER:?set in ~/stack/.env}
      - OPENVPN_PASSWORD=${NORDVPN_SERVICE_PASS:?set in ~/stack/.env}
      - SERVER_COUNTRIES=Sweden
      - TZ=${TZ:-Europe/Stockholm}
      - UPDATER_PERIOD=24h
    volumes:
      - /srv/appdata/gluetun:/gluetun
    # EVERY port for every container in gluetun's namespace is published here.
    ports:
      - "8080:8080"      # qBittorrent WebUI
      - "6881:6881"      # torrent TCP
      - "6881:6881/udp"  # torrent UDP
      - "9696:9696"      # Prowlarr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun: {condition: service_healthy}
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Stockholm}
      - WEBUI_PORT=8080
    volumes:
      - /srv/appdata/qbittorrent:/config
      - /mnt/usb1/media:/downloads
      - /mnt/usb2/share/torrents/movies:/auto_movies
      - /mnt/usb2/share/torrents/tv:/auto_tv
      - /mnt/usb2/share/torrents/incomplete:/auto_incomplete
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun: {condition: service_healthy}
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Stockholm}
    volumes:
      - /srv/appdata/prowlarr:/config
    restart: unless-stopped

  finder:
    build: ../../git/torrent_finder
    container_name: torrent-finder
    depends_on: [prowlarr]
    environment:
      - TZ=${TZ:-Europe/Stockholm}
      # gluetun, not prowlarr/qbittorrent — see README §5.
      - PROWLARR_URL=http://gluetun:9696
      - PROWLARR_API_KEY=${PROWLARR_API_KEY:?set in ~/stack/.env}
      - QBITTORRENT_URL=http://gluetun:8080
      - QBITTORRENT_USERNAME=${QBITTORRENT_USERNAME:-admin}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD:?set in ~/stack/.env}
      # Container-side paths, unchanged by the move off the Pi.
      - MOVIES_SAVE_PATH=/auto_movies
      - TV_SAVE_PATH=/auto_tv
      - OTHER_SAVE_PATH=/downloads/other
      - MAX_TORRENT_SIZE_GB=${MAX_TORRENT_SIZE_GB:-25}
      - MIN_FREE_SPACE_GB=${MIN_FREE_SPACE_GB:-20}
      - INDEXER_NAME=TorrentDay
      # This app is published on the internet; refuse to start without auth.
      - UI_USERNAME=${UI_USERNAME:?set in ~/stack/.env}
      - UI_PASSWORD=${UI_PASSWORD:?set in ~/stack/.env}
    ports:
      - "8010:8000"    # LAN only; the tunnel uses the container port directly
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host          # needed for DLNA/GDM local discovery
    # Quick Sync on the N95's iGPU. The gid of the host's `render` group varies
    # per install, so it comes from .env: getent group render | cut -d: -f3
    # Hardware transcoding itself needs Plex Pass; without it this is inert but
    # harmless. Enable in Settings > Transcoder (README §8).
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:?run: getent group render | cut -d: -f3}"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - VERSION=docker
      - TZ=${TZ:-Europe/Stockholm}
      # First run only; remove once the server is claimed. Token expires in 4
      # minutes — https://plex.tv/claim
      # - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - /srv/appdata/plex/config:/config
      # Transcode scratch: heavy short-lived writes. Swap for the tmpfs below if
      # RAM allows (needs headroom for every concurrent transcode; a full tmpfs
      # fails playback rather than spilling to disk).
      - /srv/appdata/plex/transcode:/transcode
      - /mnt/usb1/media:/media
      - /mnt/usb2/share/torrents/movies:/movies2
      - /mnt/usb2/share/torrents/tv:/tv2
    # tmpfs:
    #   - /transcode:size=4g
    restart: unless-stopped
